<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found | Dr. Sameh Elguizaoui, M.D.</title>
  <meta name="description" content="The page you are looking for does not exist. Visit Dr. Sameh Elguizaoui's orthopedic surgery practice." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://worrellburton.github.io/sam/" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a; color: #f1f5f9; text-align: center; }
    .wrap { max-width: 480px; padding: 2rem; }
    h1 { font-size: 4rem; margin: 0 0 0.5rem; color: #818cf8; }
    p { color: #94a3b8; line-height: 1.6; }
    a { color: #818cf8; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
  <script>
    // SPA redirect for GitHub Pages: try client-side routing before showing 404
    (function() {
      var defined = ["/","/about","/contact","/reviews","/faq","/blog","/book",
        "/services/sports-medicine","/services/arthroscopic-surgery","/services/regenerative-medicine",
        "/services/joint-preservation","/services/cartilage-repair","/services/shoulder-knee-surgery"];
      var path = window.location.pathname.replace(/\/sam\/?/, "/").replace(/\/$/, "") || "/";
      if (defined.indexOf(path) !== -1 || path.startsWith("/blog/") || path.startsWith("/services/") || path.startsWith("/conditions/") || path.startsWith("/doczoc")) {
        window.location.replace("/sam" + path);
      }
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <p><a href="/sam/">Return to Homepage</a> | <a href="/sam/contact">Contact Us</a></p>
  </div>
</body>
</html>
